# XcodeGen spec. Generate the Xcode project with:
#   brew install xcodegen && xcodegen generate
name: HarmonyKitchen
options:
  bundleIdPrefix: com.rst
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  createIntermediateGroups: true
  xcodeVersion: "16.0"

configFiles:
  Debug: Config/App.xcconfig
  Release: Config/App.xcconfig

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES

packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: "11.0.0"
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: "8.0.0"

targets:
  HarmonyKitchen:
    type: application
    platform: iOS
    sources:
      - path: HarmonyKitchen
    dependencies:
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseFirestore
      - package: Firebase
        product: FirebaseStorage
      - package: Firebase
        product: FirebaseMessaging
      - package: Firebase
        product: FirebaseCrashlytics
      - package: GoogleSignIn
        product: GoogleSignIn
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID)
        PRODUCT_NAME: HarmonyKitchen
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        OTHER_LDFLAGS: $(inherited) -ObjC
        DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
    info:
      path: HarmonyKitchen/Info.plist
      properties:
        CFBundleDisplayName: Harmony Kitchen
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, nso, ts, ve]
        CFBundleAllowMixedLocalizations: true
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: Logo
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIAppFonts: [IslandMoments-Regular.ttf]
        NSCameraUsageDescription: Harmony Kitchen uses the camera to photograph your recipes, your profile picture, and ingredients you want to scan.
        NSMicrophoneUsageDescription: Harmony Kitchen uses the microphone so you can say the ingredients you have.
        NSSpeechRecognitionUsageDescription: Harmony Kitchen turns your spoken ingredients into text.
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLName: GoogleSignIn
            CFBundleURLSchemes: [$(GOOGLE_REVERSED_CLIENT_ID)]
        SpoonacularAPIKeys: $(SPOONACULAR_API_KEYS)
        RapidAPIKey: $(RAPIDAPI_KEY)
    entitlements:
      path: HarmonyKitchen/HarmonyKitchen.entitlements
      properties: {}

  HarmonyKitchenTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: HarmonyKitchenTests
    dependencies:
      - target: HarmonyKitchen
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/HarmonyKitchen.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/HarmonyKitchen
        BUNDLE_LOADER: $(TEST_HOST)

schemes:
  HarmonyKitchen:
    build:
      targets:
        HarmonyKitchen: all
        HarmonyKitchenTests: [test]
    test:
      targets: [HarmonyKitchenTests]
      gatherCoverageData: true
